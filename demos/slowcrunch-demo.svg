<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">slowcrunch terminal demo preview</title>
  <desc id="desc">Static preview of the slowcrunch terminal interface with scientific calculations, angle formatting, list inspection, and linear regression output.</desc>
  <rect width="960" height="560" rx="18" fill="#0b1220"/>
  <rect x="20" y="20" width="920" height="48" rx="12" fill="#172033"/>
  <circle cx="52" cy="44" r="8" fill="#ff5f56"/>
  <circle cx="76" cy="44" r="8" fill="#ffbd2e"/>
  <circle cx="100" cy="44" r="8" fill="#27c93f"/>
  <text x="140" y="49" fill="#d7e3ff" font-family="Menlo, Monaco, Consolas, monospace" font-size="20">slowcrunch demo</text>
  <rect x="20" y="84" width="920" height="456" rx="12" fill="#111827"/>
  <text x="44" y="122" fill="#d7e3ff" font-family="Menlo, Monaco, Consolas, monospace" font-size="19">
    <tspan x="44" dy="0">slowcrunch</tspan>
    <tspan x="44" dy="30">Type an expression or 'quit' to exit.</tspan>
    <tspan x="44" dy="30">Commands: :angles, :format, :head, :help, :history, :import-vars, :show ...</tspan>
    <tspan x="44" dy="38" fill="#93c5fd">&gt;&gt; 10k + 25</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">10025.0</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; :format si</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">Output format set to si.</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; 10000</tspan>
    <tspan x="72" dy="30" fill="#86efac">10k</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; :angles dms</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">Angle format set to dms.</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; 90deg / 2</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">45deg 0' 0"</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; values = [1, 2, 3, 4, 5]</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">list[5]</tspan>
    <tspan x="96" dy="30" fill="#cbd5e1">[0] 1</tspan>
    <tspan x="96" dy="26" fill="#cbd5e1">[1] 2</tspan>
    <tspan x="96" dy="26" fill="#cbd5e1">[2] 3</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; :head values 3</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">values = list[3] [1, 2, 3]</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; mean(values)</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">3</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; linreg([1, 2, 3], [2, 4, 6])</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">linreg[slope=2, intercept=0]</tspan>
    <tspan x="44" dy="30" fill="#93c5fd">&gt;&gt; :show ans</tspan>
    <tspan x="72" dy="30" fill="#f8fafc">ans = linreg[slope=2, intercept=0]</tspan>
  </text>
</svg>
